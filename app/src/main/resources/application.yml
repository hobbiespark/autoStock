spring:
  application:
    name: autostock
  profiles:
    default: paper          # 기본은 반드시 모의 (실전 오적용 방지, PLAN 3절)
  threads:
    virtual:
      # JDK21 가상 스레드 — 키움 REST 호출(.block())처럼 블로킹 I/O가 중심인 워크로드에 적합
      # (PLAN ADR-5). 운영에서 이상 징후가 보이면 바로 false로 되돌릴 수 있는 플래그로 유지한다.
      # 단, synchronized 블록 안에서 블로킹하면 가상 스레드가 캐리어에 "고정(pinning)"되는
      # JDK21의 알려진 이슈가 있어, 핫패스의 synchronized는 ReentrantLock으로 교체했다
      # (monitor/EventFeed 참고).
      enabled: true
  datasource:
    # socketTimeout: PC 절전·도커 DB 정지 뒤 죽은 소켓에 걸린 쿼리가 커넥션을 영원히 잡지 않게 한다
    # (2026-09-22 절전 복귀 후 풀 고갈 실측 — 죽은 커넥션 10개가 풀 전체를 점유).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autostock}?socketTimeout=30
    username: ${DB_USER:autostock}
    password: ${DB_PASSWORD:autostock}
    hikari:
      connection-timeout: 10000        # 풀 대기 상한 10초(기본 30초) — 풀 고갈 시 빨리 실패해 스케줄 회차가 쌓이지 않게
      validation-timeout: 3000
      leak-detection-threshold: 60000  # 60초 이상 반환 안 된 커넥션을 스택과 함께 WARN — 다음 고갈 때 범인 식별용
  jpa:
    hibernate:
      ddl-auto: validate    # 스키마는 Flyway로만 관리
    open-in-view: false
    properties:
      hibernate:
        # 이벤트 스토어 append가 다건일 때 INSERT를 모아 보내 왕복을 줄인다 (PLAN ADR-5).
        jdbc:
          batch_size: 50
          # 시간대 명시(A5, 2026-09-30) — 저장은 UTC. 지금 스키마는 TIMESTAMPTZ(Instant)와 DATE(LocalDate)뿐이라
          # 이 값으로 바뀌는 동작은 없다(실측: JVM KST·PG 서버 UTC에서 설정 유무 모두 값 동일, aiDoc/time.md).
          # 나중에 시간대 없는 TIMESTAMP 컬럼이 생겨도 JVM 시간대(운영 PC KST)에 따라 달라지지 않게 한다.
          time_zone: UTC
        order_inserts: true
  flyway:
    enabled: true
  jackson:
    # 시간대 명시(A5) — 응답의 Instant는 원래 UTC(ISO-8601 'Z')라 결과가 같다. JVM 기본 시간대에 기대지 않게 적는다.
    time-zone: UTC
  http:
    reactiveclient:
      # 모든 외부 HTTP(WebClient) 호출의 공통 상한 — Reactor Netty 기본은 응답 타임아웃이 없어
      # 절전 복귀·망 단절 뒤 block()이 무한 대기한다(2026-09-22 사고 계열). DART 전용 커넥터도 이 값을 쓴다.
      # 키움 REST는 KiwoomRestClient의 15초 per-call 상한이 먼저 걸린다.
      connect-timeout: 5s
      read-timeout: 20s

server:
  # 루프백 전용 바인딩 — 무인증 shutdown·킬스위치·test-signal·Swagger를 외부망에서 막는다.
  # 원격 접속이 필요해지면 인증(Spring Security)을 먼저 붙인 뒤 연다.
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        # caches: Caffeine 히트율 등 캐시 통계를 Micrometer 경유로 노출 (PLAN ADR-5, 목표 히트율 >90%)
        include: health,info,metrics,caches,shutdown
  # shutdown: stop_autostock.bat의 graceful 종료 경로(POST /actuator/shutdown).
  # 개인 PC 로컬 운영 전제 — 외부망 노출 시 이 엔드포인트부터 닫을 것.
  endpoint:
    shutdown:
      access: unrestricted
    health:
      # 헬스 세부(kiwoomWs·kiwoomAuth·killSwitch·db 등, 실행 계획 1.7)를 보여 준다 — 루프백 바인딩이라 외부에 나가지 않는다
      show-details: always
      show-components: always

risk:
  max-position-pct-per-symbol: 0.10
  max-concurrent-positions: 5
  stop-loss-pct: -0.03          # 미사용 — ADR-7 E4(손절·익절 청산) 사용 예정, 바꿔도 동작 불변(실행 계획 1.9)
  take-profit-pct: 0.05         # 미사용 — 위와 같음
  daily-max-loss-pct: -0.02     # 일 최대 손실 -2% — 도달 시 DailyPnlTracker가 킬스위치 작동
  daily-max-orders: 30
  paper-equity: 10000000        # 시뮬레이션 계좌 1천만원 — LIVE는 BrokerEquitySource(잔고 연동)로 대체
  fee-rate: 0.00015             # 매수/매도 수수료율 — 실현손익 추정용(backtest.CostModel과 동일값)
  sell-tax-rate: 0.0020         # 매도 증권거래세율(2026-01-01 시행: 코스피 0.05%+농특세 0.15%, 코스닥 0.20%) — CostModel과 동일값
  enforce-market-hours: true    # 장 시간(09:00~15:30 KST) 외 Signal 거부 — SIM 테스트에서만 개별적으로 false
  manual-order-max-krw: 1000000 # 대시보드 수동 매수 1건 금액 상한(원) — 초과하면 RiskGate가 거부(D-06, 9/18 193주 사고 재발 방지). 실전 전환 시 재설정
  capital:                      # 운용 자금(2026-10-21 사용자 결정 — 계좌 전체가 아니라 이 금액 안에서만, aiDoc/multi-strategy-paper-2026-10-16.md 8절). 0이면 끔, 켤 때는 200만~2,000만 원만 받는다
    limit-krw: 5000000          # 2026-10-26 사용자 결정: 2,000만 → 500만(종목당 투자액 과다). 사이징 기준 = min(계좌 평가액, 이 값) · 계좌 보유 매수 원가 + 미체결 매수 + 새 주문 ≤ 이 값(수동 주문 포함) · 일 손실 한도 기준 = max(이 값, 오늘 최대 보유액)
    one-share-max-budget-multiple: 2.0   # 슬리브 예산으로 0주면 1주 값이 예산의 이 배수 이하일 때 1주(전체 상한은 그대로). 0이면 끔
  multi-strategy:               # 다전략 슬리브(2026-10-16, aiDoc/multi-strategy-paper-2026-10-16.md 1절) — 전략마다 계좌의 정해진 비율만 쓰고, 보유·손익을 전략별로 센다
    allow-reducing-sell-on-loss-limit: false   # D-20 (b) 일 손실 한도 킬스위치 중 보유 이내 매도 허용 — 기본 꺼짐, paper 프로필에서 켠다
    sleeves:                    # 1종목 예산 = 계좌 평가액 × fraction ÷ max-positions × 신호 비중. 합 100%. 없는 전략 ID(수동 주문)는 예전 규칙
      - { strategy: C3-MOMENTUM, fraction: 0.50, max-positions: 5 }   # 종목당 10% — 예전 C3 사이징과 같다
      - { strategy: VB-DAY,      fraction: 0.15, max-positions: 3 }   # 단타 변동성 돌파 — 종목당 5%
      - { strategy: ON-CLOSE,    fraction: 0.15, max-positions: 3 }   # 종가 → 다음 날 시가 — 종목당 5%
      - { strategy: TA-H1,       fraction: 0.04, max-positions: 5 }   # 차트 기법 — 규칙마다 4%, 종목당 0.8%
      - { strategy: TA-H2,       fraction: 0.04, max-positions: 5 }
      - { strategy: TA-H3,       fraction: 0.04, max-positions: 5 }
      - { strategy: TA-H4,       fraction: 0.04, max-positions: 5 }
      - { strategy: TA-H5,       fraction: 0.04, max-positions: 5 }

execution:
  mode: SIM                     # SIM: 즉시 체결 시뮬레이션 / LIVE: 키움 주문 API
  stale-order-timeout: 5m        # SUBMITTED로 이 시간 이상 머문 주문을 StaleOrderCanceller가 자동 취소 요청
  tr-probe:                      # 주문 경로 실측(실행 계획 1.6) — 매 거래일 at 이후 첫 분에 한 번, 모의 서버에서만(aiDoc/auto-measurement.md)
    enabled: true
    from: 2026-10-08             # 이 날부터 매 거래일(1차 10/7은 하루짜리였다). 하루만 재려면 until을 같은 날로
    at: "09:30"
    symbol: "069500"             # KODEX 200 1주 지정가 매수(현재가 -discount-pct%)·매도(+discount-pct%) → 조회 → 취소 → 조회, 단계마다 점검
    discount-pct: 15
    fill-round-trip-days: MONDAY # 체결 왕복(시장가 1주 매수 → 체결 확인 → 매도, 보유 수량 그대로)을 하는 요일. 그날 빠지면 앱이 같은 주 다음 거래일에 한다. 비우면 안 함
    notify-success: false        # 점검이 모두 맞으면 로그만, 어긋나거나 확인할 일이 있을 때만 텔레그램 WARN
    output-dir: ../data/measured/tr_probe   # 날짜(yyyyMMdd) 폴더에 응답 원문(계좌번호 가림)·요약 — 커밋 대상 아님
  pre-open-probe:                # 장전 키움 응답 실측 — 매 거래일 from~to 5분마다 조회 TR 응답 코드·걸린 시간(주문 없음)
    enabled: true
    from: "07:30"
    to: "08:40"                  # 이 시각 틱에서 하루 요약(로그 한 줄, 오류가 있던 날만 텔레그램 INFO)
    symbols: "005930,069500"     # 분봉(ka10080)을 잴 종목 — NXT 거래 종목과 ETF. 첫 종목은 시세(ka10001)도
    output-dir: ../data/measured/pre_open

trading:
  position-reconcile:
    enabled: false              # 잔고↔장부 5분 대사(알림·메트릭만, 자동 교정 없음 — 실행 계획 1.5). 장외 검증 후 true

strategy:
  c3:
    enabled: false                                   # 자택망 검증 전까지 비활성 — 켜기 전 반드시 확인
    symbols: 005930,000660,035420,035720,069500       # 삼성전자, SK하이닉스, NAVER, 카카오, KODEX200
    lookback-n: 120                                    # TODO: 분기별 walk-forward 재선정 절차 필요(수동)
    decision-interval-days: 21                         # 거래일(봉) 수 — 백테스트 21봉과 같음, 마지막 판단일은 strategy_state(V13)
    target-vol-annual: 0.20
    regime-index-symbol: 069500                        # KODEX200 — 국면 필터 기준 지수
    regime-sma-days: 200
  vb:                                                # 단타 변동성 돌파(VB-DAY) — 값은 사전 선언(문서 3-1). 시작 스크립트가 켠다
    enabled: false
  on:                                                # 종가 → 다음 날 시가(ON-CLOSE) — 문서 3-2
    enabled: false
  ta:                                                # 차트 기법 5종(TA-H1~H5) — 문서 3-3
    enabled: false

market:
  holiday-api:
    enabled: true                                 # 실측 확정 2026-09-18(getRestDeInfo _type=json, 인코딩 키 그대로 전송) — docs/measured/ext_probe_20260918_holiday_*.json
    service-key: ${DATA_GO_KR_SERVICE_KEY:}       # 공공데이터포털 발급 서비스키 — 커밋 금지, 환경변수로만 주입
    base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService

macrointel:
  enabled: true                         # 실측 확정 2026-09-18(FRED observations[0], ECOS 14일 범위+항목코드) — docs/measured/ext_probe_20260918_{fred,ecos}_*.json
  fred-api-key: ${FRED_API_KEY:}        # FRED 발급 키 — 커밋 금지, 환경변수로만 주입
  ecos-api-key: ${ECOS_API_KEY:}        # ECOS 발급 키 — 커밋 금지, 환경변수로만 주입
  vix-caution-threshold: 25.0           # VIX 이 값 이상이면 보수 모드(신규 매수 금지, 청산은 허용)
  vix-severe-threshold: 35.0            # VIX 이 값 이상이면 킬스위치 작동(전면 정지)
  usd-krw-caution-threshold: 1450.0     # 원/달러 환율 이 값 이상이면 보수 모드
  max-staleness-days: 7                 # VIX·원/달러를 이 일수보다 오래 못 받으면 보수 모드 + 하루 1회 경고(실행 계획 1.4)
  blacklist:
    enabled: true                         # DART 실측 완료(2026-09-11) + start_autostock.bat가 이미 true로 기동 중 — yml 기본값도 일치시킴(2026-09-18)
    dart-api-key: ${DART_API_KEY:}        # OpenDART 발급 키(ipo.dart.api-key와 같은 키 재사용) — 커밋 금지
    lookback-days: 7                      # list.json(주요사항보고서) "최근 N일" 조회 창
    retention-days: 180                   # 공시일로부터 블랙리스트 등록 기간(ADR-14 근거 — 6~24개월 하한)

dart:
  enabled: true                         # DART 실측 완료(docs/measured/dart_estkRs_20260911.json). 08:20 스케줄에서만 호출되므로 키 없는 CI엔 영향 없음 — 2026-09-18 기본값 true로 전환(bat 오버라이드와 일치)
  api-key: ${DART_API_KEY:}             # OpenDART 발급 키 — 커밋 금지, 환경변수로만 주입
  lookback-days: 14                     # list.json 조회 시 "최근 N일" 창(ADR-9 배치 사양)

ipo:
  filter:
    min-institutional-competition-rate: 500    # 기관경쟁률 500:1 이상(ADR-9 ②)
    min-lockup-commit-rate: 0.20                # 의무보유확약비율 20% 이상
  subscription:                                 # 청약 금액 추천(2026-10-30, aiDoc/ipo-automation.md "2026-10-30 바뀜")
    budget-krw: 2000000                         # 공모주 청약 예산(원)
    margin-rate: 0.5                            # 청약 증거금률(주관사마다 다름 — 알림에 "주관사 공고 확인")
    min-qty: 10                                 # 최소 청약 수량(주, 균등 최소 단위)
    unit-qty: 10                                # 청약 단위(주, 비례 수량은 이 단위로 내림)

autostock:
  minute-archive:
    enabled: false              # 분봉 일일 적재(평일 15:45 KST, ka10080 1페이지→data/minutes/*.csv append).
                                # ka10080은 최근 1년 롤링만 제공(실측 2026-09-11)이라 다년 분봉은 자체 축적이 유일 경로
    symbols: 005930,000660,035420,035720,069500
    dir: ../data/minutes
  listing-watch:
    enabled: false              # 신규 상장 확인(market.NewListingWatcher, 2026-10-13) — 거래일 08:05·08:40(실패하면 09~15시 매시 5분).
                                # 키움 ka10099(종목정보 리스트)로 공모주 상장일·종목코드를 채운다. start_autostock.bat가 켠다(CI·테스트는 꺼 둔다)
  ws:
    enabled: false              # 앱키 발급 후 true
    stale-after: 180             # 연속 단절이 이 초를 넘으면 MarketDataStale 발행 → risk가 킬스위치 작동(PLAN 3절)
    order-notice-capture:        # 주문체결통보(type 00) 원문 상시 기록(계좌번호 가림) — 취소 확인·거부·부분 체결 실측(aiDoc/auto-measurement.md)
      enabled: true
      dir: ../data/measured/ws_orders   # 하루 파일 ws_orders_yyyyMMdd.jsonl — 커밋 대상 아님
  session:                      # 장외 대기(2026-09-29) — 프로세스는 계속 실행, 장외에는 WS 해제·주기 대사/미체결 취소 점검 중지
    enabled: true               # false면 24시간 ACTIVE(기존 동작) — 장외에 WS·대사를 직접 검증할 때만 끈다
    wake-time: "08:30"          # 거래일 장 대응 시작(정규장 09:00 − 30분). NXT(08:00~20:00) 대응 시 07:30
    sleep-time: "16:00"         # 장외 대기 진입(정규장 15:30 + 30분, 15:45 분봉·15:50 리포트 이후). NXT 대응 시 20:30
    keep-awake: true            # ACTIVE 동안 Windows 유휴 절전 차단(monitor.SleepGuard, 2026-09-30 장중 절전 사고). 수동 절전·덮개 닫기는 못 막음
    keep-awake-from: "07:30"    # 거래일 이 시각부터 미리 막는다 — 장전 실측·08:30 장 대응 시작 전에 다시 잠들지 않게(2026-10-08). 비우면 ACTIVE 동안만
    keep-display-on: true       # 막는 동안 화면도 켜 둔다 — 최신 대기 모드 PC는 화면이 유휴로 꺼지면 대기에 들어가 앱이 멈춘다(2026-10-12 실측, aiDoc/sleep-resume.md 5절)

monitor:
  telegram:
    enabled: false                          # 기본 꺼짐 — start_autostock.bat가 .env에 TELEGRAM_BOT_TOKEN·CHAT_ID가 있을 때만 켠다(Phase 0.7)
    bot-token: ${TELEGRAM_BOT_TOKEN:}       # BotFather 발급 토큰 — 커밋 금지, 환경변수로만 주입
    chat-id: ${TELEGRAM_CHAT_ID:}           # 알림 수신 + 원격 명령 허용 chat_id (타인 명령 차단의 기준값)
  heartbeat:
    url: ${MONITOR_HEARTBEAT_URL:}          # Healthchecks.io ping URL — 비면 꺼짐. 장중(ACTIVE) 1분마다 GET(monitor.HeartbeatPinger, Phase 0.7)
  market-check:                             # 장중 자가 점검(monitor.MarketDayCheck, aiDoc/market-hours-automation.md)
    enabled: true                           # 09:15 C3 실행 확인, 10:00·14:00 상태 한 줄(이상일 때만 텔레그램)
    strategy-run-notice: true               # C3 09:05 판단 요약을 텔레그램으로 한 줄
    max-message-age-seconds: 120            # 장중 WS 마지막 메시지가 이보다 오래되면 이상
  performance:                              # 성과 측정 시작일(2026-10-22 사용자 요청 — 운용 자금 2,000만 원 뒤로 다시 측정). 지난 기록은 지우지 않고 보는 범위만 자른다
    since: 2026-10-23                       # 10/22는 운용 자금 전 보유(약 6,833만 원) 정리일이라 뺀다 — 10/22 15:26 첫 운용 자금 매수의 실현손익이 10/23부터 잡힌다

---
# 모의투자(paper, 기본 프로필) — KIWOOM_MOCK_G_*(모의 일반계좌) 사용.
# 구명(KIWOOM_APP_KEY/SECRET) 폴백 허용 — 기존 .env/CI 시크릿과의 하위호환용(PROGRESS 5절).
spring:
  config:
    activate:
      on-profile: paper
risk:                           # 모의투자 다전략 실측 기간 값(2026-10-16 사용자 선택 — 문서 1-2절). 실전(live) 프로필은 위 기본값 그대로
  daily-max-loss-pct: -0.05     # 일 손실 킬스위치 −2% → −5%(모의 동안 완화)
  daily-max-orders: 150         # 전략 8개(C3·단타·종가·차트 5종)가 함께 주문
  max-concurrent-positions: 40  # 계좌 동시 보유 상한 — 실제 제한은 전략별 max-positions(5+3+3+25=36)
  multi-strategy:
    allow-reducing-sell-on-loss-limit: true   # D-20 (b) — 단타·종가 전략의 정해진 시각 청산이 손실 한도로 막히지 않게
kiwoom:
  app-key: ${KIWOOM_MOCK_G_APP_KEY:${KIWOOM_APP_KEY:}}
  app-secret: ${KIWOOM_MOCK_G_APP_SECRET:${KIWOOM_APP_SECRET:}}
  rest-base-url: https://mockapi.kiwoom.com
  ws-url: wss://mockapi.kiwoom.com:10000/api/dostk/websocket

---
# 실전(live) — 게이트 ② 통과 + 키 재발급 전 사용 금지 (PLAN 1절)
# KIWOOM_LIVE_APP_KEY/SECRET 전용 — 모의 키(KIWOOM_MOCK_G_*/구명 KIWOOM_APP_*)로의 폴백 절대 금지.
# 미설정 시 빈 문자열이 주입되어 키움 인증이 즉시 실패한다 — 이것이 의도된 안전장치다.
spring:
  config:
    activate:
      on-profile: live
kiwoom:
  app-key: ${KIWOOM_LIVE_APP_KEY:}
  app-secret: ${KIWOOM_LIVE_APP_SECRET:}
  rest-base-url: https://api.kiwoom.com
  ws-url: wss://api.kiwoom.com:10000/api/dostk/websocket

# Swagger UI(springdoc) — 공모주 반수동 입력 등 수동 API 호출용. 개인 PC 로컬 운영 전제(외부망 노출 시 닫을 것).
# 접속: http://localhost:8080/swagger-ui.html  (OpenAPI JSON: /v3/api-docs)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true     # 열자마자 입력 폼 활성화
  paths-to-match: /api/**
